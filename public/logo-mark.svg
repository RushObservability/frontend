<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rush Observability, Logomark. Solid diamond with the signal pulse cut out.
       The cut is transparent, so the mark works on light and dark backgrounds. -->
  <defs>
    <mask id="rush-pulse-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <polyline points="4,32 20,32 25,20 31,44 36,26 40,37 43,32 60,32" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <path d="M32 3 L59 32 L32 61 L5 32 Z" fill="#3B82F6" mask="url(#rush-pulse-cut)"/>
</svg>
