# Included inside each location because nginx stops inheriting add_header
# directives as soon as a child location defines its own add_header (for
# example, Cache-Control).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Vue applies dynamic chart geometry through direct CSSStyleDeclaration property
# assignments. CSP permits those while blocking literal style attributes and
# cssText. Font and style assets are bundled into the same-origin application.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src-elem 'self'; style-src-attr 'none'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
# Keep the next policy observable before it is promoted to enforcement. Reports
# are bounded and sanitized by query-api; no document URL or source sample is retained.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src-elem 'self'; style-src-attr 'none'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/security/csp-report;" always;
