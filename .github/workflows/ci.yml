name: CI

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: |
          npm test -- scripts/audit-dependencies.test.mjs
          node scripts/audit-dependencies.mjs

      - name: Security regression checks
        run: npm run security:check

      - name: Unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify open-source edition boundary
        run: npm run verify:opensource

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility smoke tests
        run: npm run test:e2e

      - name: Build production security-header image
        run: |
          set -o pipefail
          build_log=$(mktemp)
          trap 'unlink "$build_log"' EXIT
          for delay in 20 40 80 120 0; do
            if docker build --platform linux/amd64 -t rush-frontend:csp-test . 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if [[ "$delay" == 0 ]] || ! grep -Eq 'unexpected status from (HEAD|GET) request to https://cgr\.dev/[^[:space:]]+: 5[0-9]{2}' "$build_log"; then
              exit 1
            fi
            echo "Chainguard registry returned a server error. Retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Run production CSP route matrix
        run: |
          docker run --rm -d --name rush-frontend-csp-test \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            -p 127.0.0.1:4174:8080 rush-frontend:csp-test
          trap 'docker stop rush-frontend-csp-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          npm run security:headers -- http://127.0.0.1:4174/
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4174 npm run test:e2e -- csp.spec.ts
