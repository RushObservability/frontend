name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rushobservability/frontend

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether the app version changed
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          needed=true
          if [[ "$EVENT_NAME" == push && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            previous="$(git show "${BEFORE_SHA}:package.json" | jq -er .version)"
            current="$(jq -er .version package.json)"
            if [[ "$previous" == "$current" ]]; then
              needed=false
              echo "Package metadata changed without a version bump; no release requested." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: release-plan
    if: needs.release-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json has an invalid release version: $version" >&2
            exit 1
          fi

          if [[ "$lock_version" != "$version" ]]; then
            echo "package-lock.json version $lock_version does not match package.json version $version" >&2
            echo "Run: npm install --package-lock-only" >&2
            exit 1
          fi

          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Bump the package version before releasing." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify open-source edition boundary
        run: npm run verify:opensource

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=sha,prefix=

      - name: Build and push unverified candidate
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan amd64 candidate for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan arm64 candidate for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify both runtime images use non-root accounts
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            child_digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${INDEX_DIGEST}" --format '{{json .Manifest}}' | jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            [[ "$child_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            user="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${child_digest}" --format '{{json .Image}}' | jq -r '.config.User // empty')"
            case "$user" in ""|0|root|0:*|root:*) echo "${arch} image has an unexpected root user: ${user:-unset}" >&2; exit 1;; esac
          done

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate retained image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: rush-frontend-${{ steps.version.outputs.tag }}.spdx.json
          artifact-name: rush-frontend-${{ steps.version.outputs.tag }}-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: rush-frontend-${{ steps.version.outputs.tag }}.spdx.json
          push-to-registry: true

      - name: Find previous release
        id: previous-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag="$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft,publishedAt \
              --jq 'map(select(.isDraft == false)) | sort_by(.publishedAt) | last | .tagName // ""'
          )"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_tag" ]]; then
            echo "Release notes will include pull requests merged after ${previous_tag}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous release found. Release notes will cover the full repository history." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Promote verified digest to release tags
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_TAGS: ${{ steps.docker-meta.outputs.tags }}
        run: bash scripts/promote-image.sh

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
          SBOM_PATH: rush-frontend-${{ steps.version.outputs.tag }}.spdx.json
        run: |
          release_args=(
            "$RELEASE_TAG"
            "$SBOM_PATH"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "${release_args[@]}"

  dispatch-licensed-build:
    name: Dispatch licensed build
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create licensed-build App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.LICENSE_BUILDER_APP_CLIENT_ID }}
          private-key: ${{ secrets.LICENSE_BUILDER_APP_PRIVATE_KEY }}
          owner: RushObservability
          repositories: frontend-license
          permission-actions: write

      - name: Dispatch matching licensed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.tag }}
          FRONTEND_SHA: ${{ github.sha }}
          PUBLIC_IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/RushObservability/frontend-license/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[version]=${RELEASE_VERSION}" \
            -f "inputs[frontend_ref]=${RELEASE_TAG}" \
            -f "inputs[frontend_sha]=${FRONTEND_SHA}" \
            -f "inputs[public_image_digest]=${PUBLIC_IMAGE_DIGEST}" \
            -f "inputs[source_run_url]=${SOURCE_RUN_URL}"

          echo "Dispatched frontend-license ${RELEASE_TAG}." >> "$GITHUB_STEP_SUMMARY"
